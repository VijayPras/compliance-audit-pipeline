# Local development config for the Order Service, loaded via @PropertySource
# because spring.profiles.active=local (see application.properties).

server.port=8081

spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/audit_pipeline
spring.datasource.username=audit_user
spring.datasource.password=audit_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.com.auditpipeline.orderservice=INFO

# Read directly by OrderServiceApplication.main() before Spring starts, to
# correct Windows' outdated "Asia/Calcutta" IANA alias -- see the comment
# there for why this can't just be an @Value-injected field.
app.timezone=Asia/Kolkata
