# Local development config for the Audit Service.

server.port=8082

spring.application.name=audit-service

# Same physical database as order-service -- audit-service owns its own
# tables (inbox_events, audit_results) and its own Flyway history table
# (see spring.flyway.table below) so the two services' migrations never
# collide, even though they share one Postgres instance for local dev.
spring.datasource.url=jdbc:postgresql://localhost:5432/audit_pipeline
spring.datasource.username=audit_user
spring.datasource.password=audit_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.table=flyway_schema_history_audit_service

# Kafka
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.trade-events-topic=trade-events.v1
app.kafka.compliance-alerts-topic=compliance-alerts.v1

# Rule engine thresholds -- deliberately simple and configurable, not
# hardcoded, so they can be tuned or overridden per environment.
app.rules.threshold-amount=100000
app.rules.velocity-window-minutes=5
app.rules.velocity-max-trades=3
# ISO 3166-1 alpha-2 codes -- a small illustrative list, not a real
# sanctions list. See PROGRESS.md / the build plan for using a real OFAC
# SDN snapshot here instead.
app.rules.sanctioned-countries=IR,KP,SY,CU

logging.level.com.auditpipeline.auditservice=INFO

# Read directly by AuditServiceApplication.main() before Spring starts --
# see OrderServiceApplication for why this can't just be an @Value field.
app.timezone=Asia/Kolkata

spring.flyway.baseline-version=0